name: Compile

on:
  [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile resource files
        run: |
          compile-tsr.bat
        shell: cmd
      - name: Upload compiled DLLs as artifact
        uses: actions/upload-artifact@v7
        with:
          name: TSR_DLLs
          path: |
            output/EXE/*.dll
            !output/EXE/hderesources.dll
